name: PlatformIO firmware build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO core
        run: pip install --upgrade platformio

      - name: Install requirements
        run: |
          pip install -r requirements.txt
          pip install -r analysis/requirements.txt

      - name: Build firmware (all targets)
        run: TEST_ID=0 TEST_FILE=analysis/tests/ground_boot_test.py pio run

