[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
board = beavs
framework = arduino
; Two MiB
; NOTE: flash.cpp depends on this value if this changes and the BUF_MEM in flash
;  doesn't respect that bad things could happen
board_build.filesystem_size = 2097152b
lib_deps =
  https://github.com/SCRT-Capstone-2025-26/MS5611_SPI#78704eb
  https://github.com/SCRT-Capstone-2025-26/ISM6HG256X#1e593be
  https://github.com/adafruit/Adafruit_LIS2MDL#f7b8f31
  khoih-prog/RP2040_PWM@^1.7.0
  rlogiacco/CircularBuffer@^1.4.0
  hideakitai/ArduinoEigen@^0.3.2
extra_scripts =
  pre:build_defines.py
  pre:table_gen.py

[env:release]

[env:debug]
build_flags = -D DEBUG

[env:noflash_debug]
build_flags = -D DEBUG -D NO_FLASH

[env:calib_lg]
build_flags = -D DEBUG -D NO_FLASH -D LG_CALIB

[env:calib_hg]
build_flags = -D DEBUG -D NO_FLASH -D HG_CALIB

[env:test]
; NOTE: If flash were to be used in testing it would have to be cleared on TEST reboots
build_flags = -D TEST -D NO_FLASH -D SERIAL_RX_BUFFER_SIZE=1024
